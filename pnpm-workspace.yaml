packages:
  - apps/*
  - apps/desktop/*
  - packages/*
  - packages/sdk/js

# Shared dependency versions; packages refer to them as catalog:
catalog:
  "@agentclientprotocol/sdk": "1.9.0"
  "@hono/node-server": "2.1.5"
  "@kobalte/core": "0.13.14"
  "@modelcontextprotocol/sdk": "1.32.1"
  "@playwright/test": "1.64.1"
  "@solidjs/router": "1.0.0"
  "@tsconfig/node26": "26.0.1"
  "@types/cross-spawn": "6.0.6"
  "@types/node": "26.6.5"
  "@types/semver": "7.8.0"
  cross-spawn: "7.0.6"
  diff: "9.0.0"
  esbuild: "0.28.2"
  gray-matter: "4.0.3"
  hono: "4.13.13"
  jsonc-parser: "3.3.1"
  marked: "18.1.1"
  open: "11.0.4"
  remeda: "2.52.0"
  shiki: "4.5.0"
  solid-js: "1.9.12"
  typescript: "7.0.2"
  undici: "8.12.2"
  vite: "8.3.4"
  vite-plugin-solid: "2.11.14"
  vitest: "5.0.5"
  zod: "4.6.7"

# Dependency install scripts: true runs them (native modules to build); false skips them (prebuilt binaries ship in
# the platform packages)
allowBuilds:
  electron: true
  esbuild: true
  tree-sitter: true
  "@tailwindcss/oxide": false
  electron-winstaller: false
  msgpackr-extract: false
  protobufjs: false

# The desktop UI's JSX compiler (babel-preset-solid, through vite-plugin-solid) stays at the solid-js version, 1.9.12
overrides:
  babel-preset-solid: "1.9.12"
  "@types/node": "catalog:"

patchedDependencies:
  "ghostty-web@0.4.0": patches/ghostty-web@0.4.0.patch

# New dependencies get exact versions, no ^
savePrefix: ""
