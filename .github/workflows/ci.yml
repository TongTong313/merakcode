name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs all of CI on the commit it releases
  workflow_call:

concurrency:
  # The event is part of the group so a release's CI run never cancels or queues behind the CI of a push to main
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: merak/go.mod
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm check

  scripts:
    name: Repository scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:script

  test-ts:
    name: Test (${{ matrix.package }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        package:
          - packages/util
          - packages/log
          - packages/sdk
          - apps/desktop/main
          - apps/desktop/renderer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: merak/go.mod
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
        working-directory: ${{ matrix.package }}

  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: merak/go.mod
      - run: go test ./...
        working-directory: merak
      - run: go test -race ./...
        if: runner.os == 'Linux'
        working-directory: merak
        env:
          CGO_ENABLED: "1"

  sandbox:
    name: Sandbox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CGO_ENABLED: "0"
      MERAKCODE_SANDBOX_REQUIRED: "1"
      MERAKCODE_SANDBOX_TEST_STATE: ${{ runner.temp }}/merak-sandbox
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: merak/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Initialize Windows sandbox accounts and read access
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/sandbox-ci | Out-Null
          ./script/sandbox/setup-windows.ps1 -Count 2 -StateDir $env:MERAKCODE_SANDBOX_TEST_STATE
          ./script/sandbox/grant-read-windows.ps1 -StateDir $env:MERAKCODE_SANDBOX_TEST_STATE -InstallDir "$env:GITHUB_WORKSPACE/.cache/sandbox-ci"
      - name: Run kernel isolation and shared consistency tests
        shell: pwsh
        run: ./script/sandbox/test.ps1
      - name: Reset Windows accounts, profiles, registry, firewall and state
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "$env:MERAKCODE_SANDBOX_TEST_STATE/accounts.json") {
            ./script/sandbox/reset-windows.ps1 -StateDir $env:MERAKCODE_SANDBOX_TEST_STATE
          }
          $users = @(Get-LocalUser -Name 'merak-sbx-*' -ErrorAction SilentlyContinue)
          $rules = @(Get-NetFirewallRule -Group 'MerakCode sandbox' -ErrorAction SilentlyContinue)
          $users
          $rules
          if ($users.Count -or $rules.Count -or (Test-Path $env:MERAKCODE_SANDBOX_TEST_STATE)) { throw 'Sandbox cleanup is incomplete.' }

  go-build:
    name: Go build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: merak/go.mod
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir merak run build
      - name: Verify the native binary version
        shell: bash
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=$(merak/dist/linux-x64/merak --version)
          test "$actual" = "$expected"

  e2e-sdk:
    name: SDK integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: merak/go.mod
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir packages/sdk test:e2e

  e2e-desktop:
    name: Desktop integration (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: merak/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install-deps chromium
        working-directory: apps/desktop/main
      - run: go build -o dist/linux-x64/merak ./cmd/merak
        working-directory: merak
      - run: pnpm --dir apps/desktop/renderer run build
      - run: pnpm --dir apps/desktop/main run build
      - run: xvfb-run -a pnpm --dir apps/desktop/main test:e2e e2e/chat.spec.ts e2e/composer.spec.ts e2e/permission.spec.ts e2e/tools.spec.ts e2e/conversations.spec.ts e2e/connect.spec.ts e2e/reconnect.spec.ts e2e/review.spec.ts e2e/git.spec.ts e2e/branch.spec.ts e2e/panels.spec.ts e2e/about.spec.ts e2e/group.spec.ts e2e/agents.spec.ts e2e/worktree.spec.ts e2e/board.spec.ts e2e/notify.spec.ts e2e/engine-lifecycle.spec.ts e2e/background.spec.ts e2e/layout.spec.ts
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: desktop-e2e-failures
          path: apps/desktop/main/e2e/.results
          include-hidden-files: true

  desktop-package:
    name: Desktop package smoke test
    needs: go-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: merak/go.mod
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir apps/desktop/main run package --dir --target linux-x64
      - name: Verify packaged Go engine
        shell: bash
        run: |
          resources=apps/desktop/main/release/linux-unpacked/resources
          expected=$(node -p "require('./package.json').version")
          actual=$("$resources/merak/merak" --version)
          test "$actual" = "$expected"
          test ! -e "$resources/engine/node"
          test -f "$resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/linux-x64.node"
      - run: pnpm exec playwright install-deps chromium
        working-directory: apps/desktop/main
      - run: xvfb-run -a node --import ./script/node/register.mjs apps/desktop/main/script/smoke-package.ts
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: desktop-package-failures
          path: apps/desktop/main/release/smoke-*

  # The main ruleset requires this one check, so a pull request merges only when every job above succeeded. A failed,
  # cancelled or skipped job fails it; always() makes it report even then instead of being skipped itself.
  passed:
    name: CI passed
    needs: [check, scripts, test-ts, go, sandbox, go-build, e2e-sdk, e2e-desktop, desktop-package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
