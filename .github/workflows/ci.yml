name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs all of CI on the commit it releases
  workflow_call:

concurrency:
  # The event is part of the group so a release's CI run never cancels or queues behind the CI of a push to main
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:script

  test:
    name: Test (${{ matrix.package }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        package:
          - packages/util
          - packages/log
          - packages/sandbox
          - packages/client-core
          - packages/sdk/js
          - packages/engine
          - apps/cli
          - apps/desktop/main
          - apps/desktop/renderer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # File search needs rg; without it on PATH every test process would download its own copy from GitHub
      - name: Install ripgrep
        if: contains(fromJSON('["packages/engine", "apps/cli", "packages/sdk/js"]'), matrix.package)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ;;
            macOS) HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
      - run: pnpm test
        working-directory: ${{ matrix.package }}

  sandbox:
    name: Sandbox conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up the sandbox (Windows needs a one-time setup; the runner is already an administrator)
        run: node --import ./script/node/register.mjs packages/sandbox/script/ci.ts setup
      - name: Conformance must run, not skip
        run: pnpm test test/conformance.test.ts
        working-directory: packages/sandbox
        env:
          MERAKCODE_SANDBOX_REQUIRED: "1"
      - name: Reset leaves nothing behind
        if: runner.os == 'Windows'
        run: node --import ./script/node/register.mjs packages/sandbox/script/ci.ts reset

  build:
    name: Build and smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # Building and running the package needs no dependency install scripts (they would download Electron)
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir apps/cli run build --single
      - name: Smoke test
        shell: bash
        run: |
          cd apps/cli/dist/merakcode-*/bin
          if [ "$RUNNER_OS" = "Windows" ]; then bin=$(cygpath -w "$PWD/merak.cmd"); else bin="$PWD/merak"; fi
          cd "$GITHUB_WORKSPACE"
          MERAKCODE_SMOKE_BIN="$bin" node --import ./script/node/register.mjs apps/cli/script/smoke-cli.ts

  e2e-cli:
    name: End-to-end (engine through the SDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: pnpm test:e2e
        working-directory: apps/cli

  e2e-desktop:
    name: End-to-end (desktop)
    # Electron on Linux runners needs a virtual display and a way around Ubuntu 24.04's sandbox restriction
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: choco install ripgrep -y --no-progress
      - run: pnpm --dir apps/desktop/renderer run build
      - run: pnpm --dir apps/desktop/main run build
      - run: pnpm test:e2e
        working-directory: apps/desktop/main
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-e2e-results
          path: apps/desktop/main/e2e/.results
          include-hidden-files: true
          retention-days: 7

  # The main ruleset requires this one check, so a pull request merges only when every job above succeeded. A failed,
  # cancelled or skipped job fails it; always() makes it report even then instead of being skipped itself.
  passed:
    name: CI passed
    needs: [check, test, sandbox, build, e2e-cli, e2e-desktop]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
