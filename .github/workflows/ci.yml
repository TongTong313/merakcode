name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs all of CI on the commit it releases
  workflow_call:

concurrency:
  # The event is part of the group so a release's CI run never cancels or queues behind the CI of a push to main
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: merak/go.mod
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm check

  scripts:
    name: Repository scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:script

  test-ts:
    name: Test (${{ matrix.package }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        package:
          - packages/util
          - packages/log
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
        working-directory: ${{ matrix.package }}

  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: merak/go.mod
      - run: go test ./...
        working-directory: merak
      - run: go test -race ./...
        if: runner.os == 'Linux'
        working-directory: merak
        env:
          CGO_ENABLED: "1"

  go-build:
    name: Go build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: merak/go.mod
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir merak run build
      - name: Verify the native binary version
        shell: bash
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=$(merak/dist/linux-x64/merak --version)
          test "$actual" = "$expected"

  # The main ruleset requires this one check, so a pull request merges only when every job above succeeded. A failed,
  # cancelled or skipped job fails it; always() makes it report even then instead of being skipped itself.
  passed:
    name: CI passed
    needs: [check, scripts, test-ts, go, go-build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
