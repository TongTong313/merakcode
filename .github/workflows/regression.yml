name: Manual regression

# Timing on shared runners and external connectivity are deliberately outside the PR/release gates.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Regression suite to run on all three systems
        type: choice
        options: [performance, external-network]
        default: performance
      external-target:
        description: External TCP control endpoint (http://host:port), required for external-network
        type: string

permissions:
  contents: read

jobs:
  regression:
    name: ${{ inputs.suite }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MERAKCODE_SANDBOX_TEST_STATE: ${{ runner.temp }}/merak-sandbox
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: merak/go.mod
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Install ripgrep
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ;;
            macOS) HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
      - run: pnpm test:perf
        if: inputs.suite == 'performance'
        working-directory: apps/cli
      - name: Initialize Windows sandbox accounts and read access
        if: inputs.suite == 'external-network' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/sandbox-ci | Out-Null
          ./script/sandbox/setup-windows.ps1 -Count 2 -StateDir $env:MERAKCODE_SANDBOX_TEST_STATE
          ./script/sandbox/grant-read-windows.ps1 -StateDir $env:MERAKCODE_SANDBOX_TEST_STATE -InstallDir "$env:GITHUB_WORKSPACE/.cache/sandbox-ci"
      - name: Verify external proxy enforcement
        if: inputs.suite == 'external-network'
        shell: pwsh
        run: ./script/sandbox/test.ps1 -External
        env:
          MERAKCODE_SANDBOX_EXTERNAL_TARGET: ${{ inputs.external-target }}
      - name: Reset Windows accounts, profiles, registry, firewall and state
        if: always() && inputs.suite == 'external-network' && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "$env:MERAKCODE_SANDBOX_TEST_STATE/accounts.json") {
            ./script/sandbox/reset-windows.ps1 -StateDir $env:MERAKCODE_SANDBOX_TEST_STATE
          }
          $users = @(Get-LocalUser -Name 'merak-sbx-*' -ErrorAction SilentlyContinue)
          $rules = @(Get-NetFirewallRule -Group 'MerakCode sandbox' -ErrorAction SilentlyContinue)
          $users
          $rules
          if ($users.Count -or $rules.Count -or (Test-Path $env:MERAKCODE_SANDBOX_TEST_STATE)) { throw 'Sandbox cleanup is incomplete.' }
